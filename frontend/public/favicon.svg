<svg width="32" height="32" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="galaxyGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.8" />
    </radialGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="200" height="200" rx="40" ry="40" fill="#0f172a" />

  <!-- Left tentacle - flowing spiral -->
  <path d="M 100 100 Q 78 90, 60 85 Q 42 80, 30 88 Q 20 95, 25 110 Q 28 122, 35 138"
        stroke="url(#galaxyGradient)" stroke-width="11" fill="none" opacity="0.75" stroke-linecap="round" />

  <!-- Bottom-right tentacle - organic curve -->
  <path d="M 100 100 Q 108 125, 120 148 Q 128 165, 140 175 Q 150 183, 158 180"
        stroke="url(#galaxyGradient)" stroke-width="9" fill="none" opacity="0.75" stroke-linecap="round" />

  <!-- Upper-right tentacle - sweeping arc -->
  <path d="M 100 100 Q 128 88, 148 78 Q 165 70, 178 75 Q 188 80, 185 95"
        stroke="url(#galaxyGradient)" stroke-width="10" fill="none" opacity="0.75" stroke-linecap="round" />

  <!-- Center core -->
  <circle cx="100" cy="100" r="18" fill="url(#galaxyGradient)" />
  <circle cx="100" cy="100" r="12" fill="#fff" opacity="0.4" />

  <!-- Key stars only (simplified for small size) -->
  <circle cx="65" cy="88" r="4" fill="#fbbf24" />
  <circle cx="152" cy="80" r="4" fill="#fbbf24" />
  <circle cx="115" cy="132" r="4.5" fill="#8b5cf6" />
</svg>
