services:
  mernverse-backend:
    build: ./backend
    container_name: mernverse-backend
    restart: unless-stopped
    environment:
      - MONGO_URI=mongodb://mernverse-mongo:27017/mernverse
      - PORT=5000
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET:-mernverse-secret-key-change-in-production}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    expose:
      - "5000"
    depends_on:
      - mernverse-mongo
    networks:
      - mernverse-net

  mernverse-mongo:
    image: mongo:8.0.8
    container_name: mernverse-mongo
    restart: unless-stopped
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db
      - ./backend/mongo-init/:/docker-entrypoint-initdb.d/
    networks:
      - mernverse-net
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mernverse-frontend:
    build: ./frontend
    container_name: mernverse-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - mernverse-backend
    networks:
      - mernverse-net

volumes:
  mongo-data:

networks:
  mernverse-net:
