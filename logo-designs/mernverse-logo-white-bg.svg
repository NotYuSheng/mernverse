<svg width="440" height="120" viewBox="0 0 440 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="galaxyGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.8" />
    </radialGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- White background -->
  <rect width="440" height="120" fill="#ffffff" />

  <!-- Galaxy icon (scaled and positioned on left) -->
  <g transform="translate(10, 10) scale(0.5)">
    <!-- Background circle - lighter for white background -->
    <circle cx="100" cy="100" r="100" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />

    <!-- Left tentacle - flowing spiral -->
    <path d="M 100 100 Q 78 90, 60 85 Q 42 80, 30 88 Q 20 95, 25 110 Q 28 122, 35 138"
          stroke="url(#galaxyGradient)" stroke-width="11" fill="none" opacity="0.85" stroke-linecap="round" />

    <!-- Bottom-right tentacle - organic curve -->
    <path d="M 100 100 Q 108 125, 120 148 Q 128 165, 140 175 Q 150 183, 158 180"
          stroke="url(#galaxyGradient)" stroke-width="9" fill="none" opacity="0.85" stroke-linecap="round" />

    <!-- Upper-right tentacle - sweeping arc -->
    <path d="M 100 100 Q 128 88, 148 78 Q 165 70, 178 75 Q 188 80, 185 95"
          stroke="url(#galaxyGradient)" stroke-width="10" fill="none" opacity="0.85" stroke-linecap="round" />

    <!-- Center core -->
    <circle cx="100" cy="100" r="18" fill="url(#galaxyGradient)" />
    <circle cx="100" cy="100" r="18" fill="#fff" opacity="0.3">
      <animate attributeName="r" values="18;24;18" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite" />
    </circle>

    <!-- Stars -->
    <circle cx="65" cy="88" r="4" fill="#fbbf24" opacity="0.85">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="152" cy="80" r="4" fill="#fbbf24" opacity="0.85">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="115" cy="132" r="4.5" fill="#8b5cf6" opacity="0.9">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.9s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- MERNverse text -->
  <text x="130" y="75" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="48" font-weight="700" fill="url(#textGradient)" letter-spacing="2">
    MERNverse
  </text>
</svg>
